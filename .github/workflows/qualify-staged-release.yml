name: Qualify staged Desktop release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-staged-qualification
  cancel-in-progress: false
jobs:
  installer:
    if: github.repository == 'Growthub-OS/growthub-desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: macos-15
            file: Growthub-Desktop-mac-arm64.dmg
          - platform: windows
            os: windows-latest
            file: Growthub-Desktop-win-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: v0.2.115
      SOURCE_COMMIT: cf6c20f6c5f2ad6b40c57b1d6ece69e99b6001f6
      GROWTHUB_DESKTOP_VERSION: 0.2.115
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Growthub-OS/growthub-desktop
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require staged immutable source
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,body > release.json
          node -e 'const r=require("./release.json"); if(!r.isDraft || !r.body.includes("Source commit: "+process.env.SOURCE_COMMIT)) throw Error("Staged release identity mismatch")'
      - name: Download only binary and verification assets
        run: |
          gh release download "$RELEASE_TAG" -p release-verification-tools-windows.tgz
          if [ '${{ matrix.platform }}' = mac ]; then
            gh release download "$RELEASE_TAG" -p '${{ matrix.file }}' -p mac.receipt.json
          else
            gh release download "$RELEASE_TAG" -p win-unpacked.zip
            node -e 'const fs=require("fs"),c=require("crypto");if(c.createHash("sha256").update(fs.readFileSync("win-unpacked.zip")).digest("hex")!=="0e532f123d2e8cecdfa540fd5dd4627a744e7d87b85ccf16cd049279177c60b2")throw Error("Staged Windows payload changed")'
            unzip -q win-unpacked.zip
          fi
          node -e 'const fs=require("fs"),c=require("crypto");const sha=c.createHash("sha256").update(fs.readFileSync("release-verification-tools-windows.tgz")).digest("hex");if(sha!=="97d57c7906213c767ceef1b2f0371a220c54193df4d82df7c725f7cb9179e010")throw Error("Verification tools changed")'
          tar -xzf release-verification-tools-windows.tgz
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Package the inspected Windows payload on Windows
        if: matrix.platform == 'windows'
        env:
          GROWTHUB_DESKTOP_BUILD_COMMIT: cf6c20f6c5f2ad6b40c57b1d6ece69e99b6001f6
          GROWTHUB_DESKTOP_URL: https://www.growthub.ai/dashboard/workflow/chat?project=inbox
          GROWTHUB_DESKTOP_RELEASE: '0'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node node_modules/electron-builder/cli.js --config electron-builder.config.cjs --prepackaged win-unpacked -c.electronVersion=41.5.0 --win nsis --x64 --publish never -c.directories.output=packaged
          cp packaged/Growthub-Desktop-win-x64.exe .
          node public-release.mjs inspect win-unpacked/resources "$GROWTHUB_DESKTOP_VERSION" "$SOURCE_COMMIT"
          node public-release.mjs receipt windows Growthub-Desktop-win-x64.exe "$GROWTHUB_DESKTOP_VERSION" "$SOURCE_COMMIT" windows.receipt.json
          gh release upload "$RELEASE_TAG" Growthub-Desktop-win-x64.exe windows.receipt.json
      - name: Verify full installer bytes before execution
        run: |
          node public-release.mjs receipt '${{ matrix.platform }}' '${{ matrix.file }}' "$GROWTHUB_DESKTOP_VERSION" "$SOURCE_COMMIT" actual.receipt.json
          node -e 'const fs=require("fs"),a=require("./actual.receipt.json"),b=JSON.parse(fs.readFileSync("${{ matrix.platform }}.receipt.json"));for(const k of ["version","sourceCommit","sha256","bytes","platform"])if(a[k]!==b[k])throw Error("Installer receipt mismatch: "+k)'
      - name: Install and open through unchanged production verifier
        run: GITHUB_SHA="$SOURCE_COMMIT" node installer-smoke.mjs '${{ matrix.platform }}' '${{ matrix.file }}' installer-smoke
      - name: Inspect actual installed application metadata
        run: |
          if [ '${{ matrix.platform }}' = mac ]; then
            RESOURCES="$HOME/Applications/Growthub.app/Contents/Resources"
          else
            RESOURCES="$(node -p 'require("path").join(require("os").tmpdir(),"growthub-installer-smoke","resources")')"
          fi
          node public-release.mjs inspect "$RESOURCES" "$GROWTHUB_DESKTOP_VERSION" "$SOURCE_COMMIT"
      - name: Preserve actual installer proof in the draft
        run: gh release upload "$RELEASE_TAG" installer-smoke/* --clobber
